       // --- 여기부터 복사하세요 ---
        let currentIndex = 0;
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0, 외: 0, 내: 0, 직: 0, 간: 0 };
        let nickname = ""; // 이름을 담을 전역 변수

        function startTest() {
            // 이름 입력값 가져오기
            const nameInput = document.getElementById('user-name').value;
            nickname = nameInput ? nameInput : "이름 없는 영웅"; 

            const myAudio = document.getElementById('bgm');
            if(myAudio) {
                myAudio.volume = 0.2;
                myAudio.play().catch(e => console.log("음악 재생 실패:", e));
            }

            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('question-page').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentIndex];
            const textEl = document.getElementById('question-text');
            const btnA = document.getElementById('btn-a');
            const btnB = document.getElementById('btn-b');
            const btnGroup = document.getElementById('button-group');

            const oldContainer = document.getElementById('dynamic-btn-container');
            if (oldContainer) oldContainer.remove();

            if (q.type === "scene") {
                textEl.innerText = q.content;
                btnB.style.display = 'none';
                btnA.style.display = 'block';
                btnA.innerText = "다음으로 이동하기 ➔";
                btnA.onclick = () => { currentIndex++; showQuestion(); };
            } else if (q.type === "choice_4") {
                textEl.innerText = q.question;
                btnA.style.display = 'none';
                btnB.style.display = 'none';
                const container = document.createElement('div');
                container.id = 'dynamic-btn-container';
                container.style.width = "100%";
                q.answers.forEach(ans => {
                    const btn = document.createElement('button');
                    btn.innerText = ans;
                    btn.className = "answer-btn";
                    btn.onclick = () => { currentIndex++; (currentIndex < questions.length) ? showQuestion() : showResult(); };
                    container.appendChild(btn);
                });
                btnGroup.appendChild(container);
            } else {
                textEl.innerText = q.q;
                btnA.style.display = 'block';
                btnB.style.display = 'block';
                btnA.innerText = q.a;
                btnB.innerText = q.b;
                btnA.onclick = () => nextStep('a');
                btnB.onclick = () => nextStep('b');
            }
        }

        function nextStep(choice) {
            const q = questions[currentIndex];
            if (q.score) {
                const trait = q.score[choice];
                if (scores.hasOwnProperty(trait)) scores[trait]++;
            }
            currentIndex++;
            if (currentIndex < questions.length) showQuestion();
            else showResult();
        }

// 1. 기존 showResult() 함수의 맨 아래쪽에 '데이터 저장' 로직을 추가합니다.
        function showResult() {
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');

            let code = "";
            code += (scores.E >= scores.I) ? "E" : "I";
            code += (scores.S >= scores.N) ? "S" : "N";
            code += (scores.T >= scores.F) ? "T" : "F";
            code += (scores.J >= scores.P) ? "J" : "P";
            code += (scores.외 >= scores.내) ? "외" : "내";
            code += (scores.직 >= scores.간) ? "직" : "간";

            const res = results[code] || results["default"];
            
            const resultTitle = document.querySelector('#result-page h2');
            resultTitle.innerText = `${nickname}님과 닮은 독립운동가는...`;

            document.getElementById('activist-name').innerText = res.name;
            document.getElementById('description').innerText = res.desc;

            const imgEl = document.getElementById('activist-img');
            if (res.img) {
                imgEl.src = res.img;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }

            // [추가된 로직] 참여자 데이터를 브라우저에 기록합니다.
            saveParticipantData(nickname, res.name);
        }

        // 2. [신규 추가] 브라우저에 데이터를 차곡차곡 쌓는 함수
        function saveParticipantData(name, activist) {
            // 기존에 저장된 데이터 가져오기 (없으면 빈 배열)
            let currentData = JSON.parse(localStorage.getItem('indieTestData')) || [];
            
            // 현재 시간 기록 (년-월-일 시:분)
            const now = new Date();
            const timeString = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;

            // 새 데이터 추가
            currentData.push({
                "참여자 이름": name,
                "닮은 독립운동가": activist,
                "참여 시간": timeString
            });

            // 로컬 스토리지에 다시 저장
            localStorage.setItem('indieTestData', JSON.stringify(currentData));
        }

        // 3. [신규 추가] 저장된 표 데이터를 엑셀(CSV) 파일로 뽑아내는 함수
        function downloadExcel() {
            const data = JSON.parse(localStorage.getItem('indieTestData')) || [];
            if (data.length === 0) {
                alert("아직 저장된 참여 데이터가 없습니다!");
                return;
            }

            // CSV 헤더 설정 (엑셀에서 한글이 깨지지 않도록 UTF-8 BOM 추가)
            let csvContent = "\uFEFF"; 
            csvContent += "참여자 이름,닮은 독립운동가,참여 시간\n";

            // 데이터를 한 줄씩 CSV 형식으로 변환
            data.forEach(row => {
                csvContent += `"${row['참여자 이름']}","${row['닮은 독립운동가']}","${row['참여 시간']}"\n`;
            });

            // 파일 다운로드 트리거
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `독립운동가_테스트_결과_유형.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
