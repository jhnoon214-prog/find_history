        let currentIndex = 0;
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0, 외: 0, 내: 0, 직: 0, 간: 0 };
        let nickname = ""; 

        let secretClickCount = 0;
        let secretClickTimer;

        function countSecretClicks() {
            secretClickCount++;
            clearTimeout(secretClickTimer);
            secretClickTimer = setTimeout(() => { secretClickCount = 0; }, 500);

            if (secretClickCount === 3) {
                secretClickCount = 0;
                resetTest();
                alert("비밀 스위치 작동: 테스트가 초기 화면으로 리셋되었습니다.");
            }
        }

        function startTest() {
            const nameInput = document.getElementById('user-name').value;
            nickname = nameInput ? nameInput : "이름 없는 영웅"; 

            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('question-page').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentIndex];
            const textEl = document.getElementById('question-text');
            const btnA = document.getElementById('btn-a');
            const btnB = document.getElementById('btn-b');
            const btnGroup = document.getElementById('button-group');

            const oldContainer = document.getElementById('dynamic-btn-container');
            if (oldContainer) oldContainer.remove();

            if (q.type === "scene") {
                textEl.innerText = q.content;
                btnB.style.display = 'none';
                btnA.style.display = 'block';
                btnA.innerText = "다음으로 이동하기 ➔";
                btnA.onclick = () => { currentIndex++; showQuestion(); };
            } else if (q.type === "choice_4") {
                textEl.innerText = q.question;
                btnA.style.display = 'none';
                btnB.style.display = 'none';
                const container = document.createElement('div');
                container.id = 'dynamic-btn-container';
                container.style.width = "100%";
                q.answers.forEach(ans => {
                    const btn = document.createElement('button');
                    btn.innerText = ans;
                    btn.className = "answer-btn";
                    btn.onclick = () => { currentIndex++; (currentIndex < questions.length) ? showQuestion() : showResult(); };
                    container.appendChild(btn);
                });
                btnGroup.appendChild(container);
            } else {
                textEl.innerText = q.q;
                btnA.style.display = 'block';
                btnB.style.display = 'block';
                btnA.innerText = q.a;
                btnB.innerText = q.b;
                btnA.onclick = () => nextStep('a');
                btnB.onclick = () => nextStep('b');
            }
        }

        function nextStep(choice) {
            const q = questions[currentIndex];
            if (q.score) {
                const trait = q.score[choice];
                if (scores.hasOwnProperty(trait)) scores[trait]++;
            }
            currentIndex++;
            if (currentIndex < questions.length) showQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');

            let code = "";
            code += (scores.E >= scores.I) ? "E" : "I";
            code += (scores.S >= scores.N) ? "S" : "N";
            code += (scores.T >= scores.F) ? "T" : "F";
            code += (scores.J >= scores.P) ? "J" : "P";
            code += (scores.외 >= scores.내) ? "외" : "내";
            code += (scores.직 >= scores.간) ? "직" : "간";

            const res = results[code] || results["default"];
            
            const resultTitle = document.querySelector('#result-page h2');
            resultTitle.innerText = `${nickname}님과 닮은 독립운동가는...`;

            document.getElementById('activist-name').innerText = res.name;
            document.getElementById('description').innerText = res.desc;

            const imgEl = document.getElementById('activist-img');
            if (res.img) {
                imgEl.src = res.img;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }

            // [파이어베이스 실시간 저장 호출]
            saveParticipantData(nickname, res.name);
        }

        // --- [수정] 파이어베이스 Firestore 데이터베이스 저장 함수 ---
        function saveParticipantData(name, activist) {
            db.collection("quiz_results").add({
                name: name,
                activist: activist,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => console.log("Firebase 저장 완료"))
            .catch(err => console.error("Firebase 저장 에러:", err));
        }

        // 1. 관리자 비밀번호 확인 (새 기능 연결 추가)
        // 1. 관리자 비밀번호 확인 함수 (기존 함수에 mode 조건 추가)
function checkAdminPassword(mode) {
    const passwordInput = document.getElementById('admin-password').value.trim();
    const CORRECT_PASSWORD = "0214"; 

    if (passwordInput === CORRECT_PASSWORD) {
        if(mode === 'download') { downloadCSV(); }
        else if(mode === 'stats') { calculateAndShowStats(); }
        else if(mode === 'print') { printStats(); }
        else if(mode === 'reset') { resetFirebaseData(); }
        else if(mode === 'draw') { drawRandomImpression(); } // 🎲 랜덤 뽑기
        else if(mode === 'download_impressions') { downloadImpressionsCSV(); } // 💾 소감 엑셀 다운로드
        
        document.getElementById('admin-password').value = ""; 
    } else {
        alert("비밀번호가 틀렸습니다.");
        document.getElementById('admin-password').value = "";
    }
}

// 2. 학생용 소감 제출 함수
async function submitImpression() {
    const name = document.getElementById('user-nickname').value.trim() || "익명의 학생";
    const content = document.getElementById('user-impression').value.trim();

    if (!content) {
        alert("소감을 입력해 주세요!");
        return;
    }

    try {
        await db.collection("impressions").add({
            name: name,
            content: content,
            createdAt: new Date().toLocaleString("ko-KR")
        });
        alert("소감이 성공적으로 제출되었습니다! 감사합니다. 👏");
        document.getElementById('user-impression').value = "";
        document.getElementById('user-nickname').value = "";
    } catch (error) {
        console.error("소감 제출 오류:", error);
        alert("제출 중 오류가 발생했습니다.");
    }
}

// 3. 랜덤 소감 1개 뽑기 함수
async function drawRandomImpression() {
    try {
        const snapshot = await db.collection("impressions").get();
        if (snapshot.empty) {
            alert("아직 제출된 소감이 없습니다!");
            return;
        }

        const list = [];
        snapshot.forEach(doc => list.push(doc.data()));

        const randomIndex = Math.floor(Math.random() * list.length);
        const selected = list[randomIndex];

        document.getElementById('modal-author').innerText = `📌 작성자: ${selected.name}`;
        document.getElementById('modal-content').innerText = `"${selected.content}"`;
        document.getElementById('impression-modal').classList.remove('hidden');

    } catch (error) {
        console.error("소감 불러오기 오류:", error);
        alert("소감을 가져오는 도중 오류가 발생했습니다.");
    }
}

// 4. 모달 팝업 닫기 함수
function closeImpressionModal() {
    document.getElementById('impression-modal').classList.add('hidden');
}

// 5. 누적 소감 데이터 전체 엑셀(CSV) 저장 함수
async function downloadImpressionsCSV() {
    try {
        const snapshot = await db.collection("impressions").get();
        if (snapshot.empty) {
            alert("저장할 소감 데이터가 없습니다.");
            return;
        }

        let csvContent = "\uFEFF작성시간,작성자,소감내용\n";

        snapshot.forEach(doc => {
            const data = doc.data();
            const time = data.createdAt || "";
            const name = `"${(data.name || "").replace(/"/g, '""')}"`;
            const content = `"${(data.content || "").replace(/"/g, '""')}"`;

            csvContent += `${time},${name},${content}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `활동소감_모음_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

    } catch (error) {
        console.error("엑셀 다운로드 오류:", error);
        alert("소감 엑셀 저장 중 오류가 발생했습니다.");
    }
}

        // 2. 파이어베이스에서 실시간 데이터를 읽어와 통계 표 및 그래프 생성 (기존 코드 그대로 유지)
        async function calculateAndShowStats() {
            try {
                const snapshot = await db.collection("quiz_results").get();
                const total = snapshot.size;

                if (total === 0) {
                    alert("아직 누적된 참여 데이터가 없습니다.");
                    return;
                }

                document.getElementById('total-count').innerText = total;

                const countMap = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.activist) {
                        countMap[data.activist] = (countMap[data.activist] || 0) + 1;
                    }
                });

                const sortedStats = Object.keys(countMap).map(name => {
                    return { name: name, count: countMap[name] };
                }).sort((a, b) => b.count - a.count);

                const tbody = document.getElementById('stats-tbody');
                const graphContainer = document.getElementById('stats-graph-container');
                
                tbody.innerHTML = ""; 
                graphContainer.innerHTML = "";

                sortedStats.forEach(item => {
                    const ratio = ((item.count / total) * 100).toFixed(1);

                    const graphRow = document.createElement('div');
                    graphRow.className = 'graph-row';
                    graphRow.innerHTML = `
                        <div class="graph-label">${item.name} (${item.count}명)</div>
                        <div class="graph-bar-bg">
                            <div class="graph-bar-fill" style="width: ${ratio}%; background-color: ${getRandomColor(item.name)};">
                                ${ratio}%
                            </div>
                        </div>
                    `;
                    graphContainer.appendChild(graphRow);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${item.name}</strong></td>
                        <td>${item.count}명</td>
                        <td>${ratio}%</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('stats-area').classList.remove('hidden');
            } catch (error) {
                console.error("통계 가져오기 오류:", error);
                alert("데이터를 가져오는 도중 오류가 발생했습니다.");
            }
        }

        // 3. [신규 추가] 통계 화면 인쇄 및 PDF 저장 함수
        function printStats() {
            const statsArea = document.getElementById('stats-area');
            if (statsArea.classList.contains('hidden')) {
                alert("먼저 '실시간 통계 보기'를 눌러 그래프를 띄워주세요.");
                return;
            }
            window.print();
        }

        // 4. [신규 추가] 파이어베이스 DB 전체 데이터 초기화 함수
        async function resetFirebaseData() {
            const isConfirmed = confirm("⚠️ 경고: 저장된 모든 학생의 테스트 데이터가 영구히 삭제됩니다.\n정말로 통계를 초기화하시겠습니까?");
            if (!isConfirmed) return;

            try {
                const snapshot = await db.collection("quiz_results").get();
                if (snapshot.empty) {
                    alert("삭제할 데이터가 없습니다.");
                    return;
                }

                const batch = db.batch();
                snapshot.forEach(doc => {
                    batch.delete(doc.ref);
                });

                await batch.commit();
                alert("모든 데이터가 성공적으로 초기화되었습니다.");

                document.getElementById('stats-area').classList.add('hidden');
                document.getElementById('stats-tbody').innerHTML = "";
                document.getElementById('stats-graph-container').innerHTML = "";
            } catch (error) {
                console.error("데이터 초기화 오류:", error);
                alert("초기화 중 오류가 발생했습니다.");
            }
        }

        function getRandomColor(name) {
            const colors = ['#4A6B82', '#8B5A2B', '#5A8B66', '#A25A5A', '#6D5AA2', '#A28F5A', '#5AA29A'];
            let sum = 0;
            for(let i=0; i<name.length; i++) { sum += name.charCodeAt(i); }
            return colors[sum % colors.length];
        }

        // --- [수정] 파이어베이스 전체 기록을 CSV 엑셀 파일로 다운로드 ---
        async function downloadCSV() {
            try {
                const snapshot = await db.collection("quiz_results").get();
                if (snapshot.empty) {
                    alert("저장된 데이터가 없습니다.");
                    return;
                }

                let csvContent = "\uFEFF참여자 이름,닮은 독립운동가,참여 시간\n";
                snapshot.forEach(doc => {
                    const row = doc.data();
                    let timeStr = "";
                    if (row.timestamp && row.timestamp.toDate) {
                        const date = row.timestamp.toDate();
                        timeStr = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()} ${date.getHours()}:${date.getMinutes()}`;
                    }
                    csvContent += `"${row.name || ''}","${row.activist || ''}","${timeStr}"\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                
                link.setAttribute("href", url);
                link.setAttribute("download", "독립운동가_테스트_결과.csv");
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error("CSV 다운로드 오류:", error);
                alert("데이터 다운로드 중 오류가 발생했습니다.");
            }
        }

        function resetTest() {
            currentIndex = 0;
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0, 외: 0, 내: 0, 직: 0, 간: 0 };
            nickname = "";
            if (document.getElementById('user-name')) {
                document.getElementById('user-name').value = ""; 
            }

            document.getElementById('stats-area').classList.add('hidden');
            document.getElementById('stats-tbody').innerHTML = "";
            document.getElementById('stats-graph-container').innerHTML = "";

            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('start-page').classList.remove('hidden');
        }
    </script>
</body>
